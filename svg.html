    <main>
        <h1>SVG Зображення</h1>
        <section>
            <p class="svg-pictures">Зображення 1:</p>
            <svg width="400" height="400">
                <circle cx="200" cy="200" r="120" fill="yellow" />

        </section>

              </svg>

        </section>
        <section>

            <svg width="500" height="400" style="background: #f5f5f5;">

                d="M150,100 L420,100 L160,300 L420,300" 
                fill="none" 
                stroke="teal" 
                stroke-width="60" 
                stroke-linecap="round" 
                stroke-linejoin="round"
              />
              
              <!-- Жовта внутрішня лінія -->
              <path 
                d="M160,100 L420,100 L160,300 L420,300" 
                fill="none" 
                stroke="yellow" 
                stroke-width="10" 
                stroke-linecap="round" 
                stroke-linejoin="round"
              />
            </svg>
          </section>
